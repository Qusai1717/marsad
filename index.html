<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرصد — Marsad Finance | أسعار العملات والدينار الليبي</title>
<meta name="description" content="مرصد — منصة ذكية لفهم العملات والاقتصاد. سعر الدولار مقابل الدينار الليبي، رسوم تاريخية حقيقية، تحويل العملات، وأخبار اقتصادية.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#F1EEE5; --surface:#FDFBF6; --sunken:#E7E2D3; --hairline:#D2CAB4;
  --ink:#23201A; --ink2:#6C675A; --ink3:#A29C8C;
  --gold:#D4AF37; --gold-dark:#8A6D1D; --blue:#0052CC; --tertiary:#97B0FF;
  --gain:#188A42; --gain-line:#23A55A; --loss:#D4373E; --loss-line:#E5484D;
  --amber:#8A6D1D; --amber-bg:#F2E8C9;
  --shadow:0 10px 30px rgba(35,32,26,.12);
}
html[data-theme="dark"]{
  --canvas:#141209; --surface:#1E1B13; --sunken:#272216; --hairline:#423A26;
  --ink:#F2EFE6; --ink2:#A9A493; --ink3:#6E6A5C;
  --gold-dark:#D4AF37; --blue:#6B96FF;
  --gain:#30B860; --gain-line:#30B860; --loss:#F2555C; --loss-line:#F2555C;
  --amber:#D4AF37; --amber-bg:#31290F; --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--canvas);color:var(--ink);
  font-size:15px;-webkit-font-smoothing:antialiased;transition:background .3s}
html[lang="en"] body{font-family:'Inter',sans-serif}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:var(--ink)}
a{color:inherit;text-decoration:none}
svg.ic{width:1em;height:1em;flex-shrink:0;vertical-align:-0.12em}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--gain)}.dn{color:var(--loss)}
#frame{min-height:100dvh;display:flex;flex-direction:column;position:relative}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 18px}
.hdr{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--canvas) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--hairline)}
.hdr-in{display:flex;align-items:center;gap:10px;padding:12px 0}
.hdr .brand{display:flex;align-items:center;gap:9px;flex:1}
.hdr .ttl{font-size:20px;font-weight:800;letter-spacing:-.2px}
.icon-btn{width:38px;height:38px;border-radius:8px;border:1px solid transparent;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);font-size:18px;transition:background .15s;border:1px solid transparent}
.icon-btn:hover{background:var(--sunken);border-color:var(--hairline)}
main{flex:1;padding-bottom:110px}
.view{display:none;animation:vin .22s ease-out}
.view.on{display:block}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 0 9px;
  padding-bottom:7px;border-bottom:1px solid var(--hairline)}
.sec-h b{font-size:16px;font-weight:800}
.sec-h .lnk{font-size:12.5px;font-weight:700;color:var(--gold-dark);cursor:pointer}
.cap{font-size:11.5px;color:var(--ink3);line-height:1.55}
.hgrid{display:grid;gap:18px;padding-top:18px}
@media(min-width:920px){.hgrid{grid-template-columns:1fr 380px;align-items:start}}
.hcol{min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;flex-wrap:wrap}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:700;
  background:var(--surface);border:1px solid var(--hairline);color:var(--ink);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--gold-dark)}
.chip.on{background:var(--gold-dark);border-color:var(--gold-dark);color:#fff}
.dchip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;
  padding:2px 7px;border-radius:5px;border:1px solid currentColor;font-variant-numeric:tabular-nums}
.dchip.up{color:var(--gain);background:color-mix(in srgb,var(--gain) 12%,transparent)}
.dchip.dn{color:var(--loss);background:color-mix(in srgb,var(--loss) 12%,transparent)}
.dchip.na{color:var(--ink3)}
.hero .hero-t{font-size:13px;font-weight:700;color:var(--ink2)}
.hero .hero-v{font-size:44px;font-weight:800;letter-spacing:-.5px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
@media(max-width:520px){.hero .hero-v{font-size:36px}}
.mv3{display:flex;gap:20px;margin-top:12px}
.mv3 .k{font-size:11px;color:var(--ink3);margin-bottom:2px}
.goldcard{background:var(--gold-dark);border-radius:10px;border:1px solid rgba(0,0,0,.18);padding:18px;color:#fff;cursor:pointer;transition:transform .15s}
.goldcard:active{transform:scale(.985)}
.goldcard .t{font-size:12.5px;font-weight:700;opacity:.75;margin-bottom:10px}
.gpill{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:8px 14px;
  font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;padding:12px 15px;cursor:pointer;transition:background .12s}
.row:hover{background:var(--sunken)}
.row+.row{border-top:1px solid var(--hairline)}
.row .flag{font-size:20px;flex-shrink:0}
.row .mid{flex:1;min-width:0}
.row .t1{font-size:13.5px;font-weight:700}
.row .t2{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:end}
.row .v{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.star{font-size:15px;color:var(--ink3);padding:4px;cursor:pointer;flex-shrink:0}
.star.on{color:var(--gold)}
.tiles{display:flex;gap:8px}
.tile{flex:1;background:var(--surface);border:1px solid var(--hairline);border-radius:9px;padding:12px}
.tile .k{font-size:10.5px;color:var(--ink2)}
.tile .v{font-size:15.5px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.tile .y{font-size:9.5px;color:var(--ink3)}
.ngrid{display:grid;gap:12px;margin-top:10px}
@media(min-width:760px){.ngrid{grid-template-columns:1fr 1fr}}
@media(min-width:1040px){.ngrid{grid-template-columns:1fr 1fr 1fr}}
.ncard{display:block;background:var(--surface);border:1px solid var(--hairline);border-radius:10px;
  overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .2s}
.ncard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ncard.wide{grid-column:1/-1}
.ncard .nrow{display:flex;gap:11px;padding:13px}
.ncard .nb{flex:1;min-width:0}
.ncard .meta{font-size:10.5px;color:var(--ink3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ncard .nt{font-size:13.5px;font-weight:700;line-height:1.4;margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ncard img.th{width:76px;height:76px;border-radius:10px;object-fit:cover;flex-shrink:0}
.feat{position:relative;aspect-ratio:16/7;min-height:220px}
@media(max-width:700px){.feat{aspect-ratio:16/10}}
.feat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat .scrim{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 25%,rgba(0,0,0,.78))}
.feat .fb{position:absolute;inset-inline:16px;bottom:14px;color:#fff}
.feat .ft{font-size:19px;font-weight:800;line-height:1.35;max-width:720px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.feat .fm{font-size:11.5px;opacity:.85;margin-top:5px}
.feat .badge{position:absolute;top:12px;inset-inline-start:12px;background:var(--gold);color:#fff;
  font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:99px}
.bkbtn{position:absolute;top:8px;inset-inline-end:8px;color:#fff;padding:7px;cursor:pointer;font-size:16px}
.nbk{color:var(--ink3);font-size:15px;padding:6px;cursor:pointer;flex-shrink:0}
.nbk.on,.bkbtn.on{color:var(--gold)}
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--hairline);display:flex;justify-content:center;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
@media(min-width:700px){
  #tabbar{left:50%;right:auto;transform:translateX(-50%);bottom:18px;border:1px solid var(--hairline);
    border-radius:10px;padding:7px 8px;box-shadow:var(--shadow);gap:4px}}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:86px}
@media(min-width:700px){.tab{flex-direction:row;gap:8px;padding:9px 18px;border-radius:8px;min-width:0}}

.tab .ic{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:17px;color:var(--ink3);transition:all .2s}
@media(min-width:700px){.tab .ic{width:auto;height:auto;border-radius:0;background:none!important}}
.tab .lb{font-size:10.5px;font-weight:800;color:var(--ink3)}
@media(min-width:700px){.tab .lb{font-size:13px}}
.tab.on .ic{background:var(--gold-dark);color:#fff}
.tab.on .lb{color:var(--gold-dark)}
@media(min-width:700px){.tab.on{background:var(--gold-dark)}
  .tab.on .ic,.tab.on .lb{color:#fff;background:none}}
.cwrap{max-width:560px;margin:18px auto 0}
.cline{display:flex;align-items:center;gap:10px}
.cline .amt{flex:1;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cursel{display:flex;align-items:center;gap:6px;background:var(--sunken);border:1px solid var(--hairline);
  border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:800;font-size:13.5px;flex-shrink:0}
.swapline{display:flex;align-items:center;margin:10px 0}
.swapline .l{flex:1;height:1px;background:var(--hairline)}
.swapbtn{width:40px;height:40px;border-radius:50%;background:var(--gold);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:17px;margin:0 10px;cursor:pointer}
#keypad{margin-top:12px;background:var(--surface);border:1px solid var(--hairline);border-radius:10px;padding:6px}
#keypad .krow{display:flex}
#keypad button{flex:1;margin:3px;padding:13px 0;font-size:20px;font-weight:600;border:1px solid var(--hairline);border-radius:8px;background:var(--canvas);font-variant-numeric:tabular-nums}
#keypad button:hover{background:var(--sunken)}
.seg{display:flex;background:var(--sunken);border:1px solid var(--hairline);border-radius:9px;padding:3px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink3);transition:all .15s}
.seg button.on{background:var(--surface);color:var(--ink);border:1px solid var(--hairline);border-radius:7px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px;
  border-radius:8px;font-size:14px;font-weight:700;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--gold-dark);color:#fff}
.btn.o{border:1px solid var(--hairline);color:var(--ink)}
#scr-detail{position:fixed;inset:0;background:var(--canvas);z-index:60;display:none;
  flex-direction:column;overflow-y:auto;opacity:0;transition:opacity .2s}
#scr-detail.on{display:flex;opacity:1}
#scr-detail .wrap{max-width:880px}
.chartbox{position:relative;background:var(--surface);border:1px solid var(--hairline);border-radius:10px;direction:ltr}
#chart{width:100%;height:340px;display:block;touch-action:none;cursor:crosshair}
#legend{position:absolute;top:10px;left:14px;font-size:12px;color:var(--ink2);
  pointer-events:none;font-variant-numeric:tabular-nums;direction:ltr;text-align:left}
#legend .l1{font-weight:800;color:var(--ink)}
#chart-note{font-size:10.5px;color:var(--ink3);padding:5px 4px 0}
#nohist{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;padding:22px;text-align:center;background:var(--surface);border-radius:10px}
#nohist.on{display:flex}
.cmp-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;
  padding:6px 10px;border-radius:7px;border:1px solid var(--hairline);background:var(--surface);cursor:pointer;margin:3px 2px}
.cmp-chip.off{opacity:.4}
.cmp-dot{width:8px;height:8px;border-radius:50%}
#dim{position:fixed;inset:0;background:rgba(20,17,10,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:70}
#dim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:80;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow);
  left:0;right:0;bottom:0;max-height:85%;border-radius:12px 12px 0 0;border-top:1px solid var(--hairline);
  transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.72,.28,1)}
@media(min-width:700px){#sheet{left:50%;right:auto;top:50%;bottom:auto;width:440px;max-height:80vh;
  border-radius:10px;transform:translate(-50%,-46%) scale(.97);opacity:0;border:1px solid var(--hairline)}}
#sheet.on{transform:translateY(0)}
@media(min-width:700px){#sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}}
.sheet-h{display:flex;align-items:center;padding:16px 18px 4px}
.sheet-h b{flex:1;font-size:16.5px;font-weight:800}
.sheet-b{overflow-y:auto;padding:8px 18px 24px;scrollbar-width:none}
.srch{width:100%;background:var(--sunken);border:1px solid var(--hairline);border-radius:8px;
  padding:12px 14px;font-size:14px;outline:none;margin-bottom:8px}
#toast{position:fixed;bottom:104px;left:50%;transform:translate(-50%,14px);background:var(--ink);
  color:var(--canvas);font-size:12.5px;font-weight:700;padding:10px 17px;border-radius:7px;opacity:0;
  transition:all .25s;z-index:90;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.full{position:fixed;inset:0;background:var(--canvas);z-index:100;display:none;
  flex-direction:column;align-items:center;padding:40px 28px}
.full.on{display:flex}
.brandname{font-size:28px;font-weight:800;color:var(--gold-dark);margin-top:12px}
.brandsub{font-size:13.5px;font-weight:700;color:var(--gold)}
.tagline{font-size:11px;letter-spacing:2.5px;font-weight:800;color:var(--gold-dark)}
.skel{background:var(--sunken);border-radius:10px;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
mark{background:color-mix(in srgb,var(--gold) 25%,transparent);color:inherit;border-radius:3px}
.empt{text-align:center;padding:38px 22px}

.empt .ic{width:92px;height:92px;border-radius:14px;border:1px solid var(--hairline);background:var(--sunken);display:flex;
  align-items:center;justify-content:center;font-size:38px;margin:0 auto 14px;color:var(--ink3)}
</style>
</head>
<body>
<div id="frame">
  <div class="full on" id="scr-splash">
    <div style="flex:2"></div>
    <div id="splash-logo"></div>
    <div class="brandname" id="sp-name"></div>
    <div class="brandsub" id="sp-sub"></div>
    <div style="width:44px;height:2px;background:var(--gold);margin-top:22px"></div>
    <div style="flex:3"></div>
    <div class="tagline" id="sp-tag"></div>
    <div style="height:22px"></div>
  </div>
  <div class="full" id="scr-onb">
    <div style="flex:2"></div>
    <div id="onb-logo"></div>
    <h1 id="onb-t" style="font-size:24px;font-weight:800;text-align:center;margin-top:16px"></h1>

    <div style="height:26px"></div>

  <header class="hdr"><div class="wrap hdr-in" id="hdr"></div></header>
  <main>
    <div class="wrap">

      <div class="view" id="v-convert"></div>

  <nav id="tabbar"></nav>
  <div id="scr-detail"></div>

  <div id="toast"></div>
</div>

/* ── fuzzy search: code, name, countries; case-insensitive; partial; 1-typo tolerant ── */
function lev1(a,b){ // true if edit distance ≤1 (fast, bounded)
  if(a===b)return true;const la=a.length,lb=b.length;
  if(Math.abs(la-lb)>1)return false;
  let i=0,j=0,edits=0;
  while(i<la&&j<lb){ if(a[i]===b[j]){i++;j++;continue}
    if(++edits>1)return false;
    if(la>lb)i++;else if(lb>la)j++;else{i++;j++} }
  return edits+(la-i)+(lb-j)<=1;
}
const normAr=s=>s.replace(/[\u064B-\u0652\u0670]/g,"").replace(/[أإآٱ]/g,"ا")
  .replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/^ال| ال/g," ").trim();
function fuzzyScore(q,code){
  const m=metaOf(code),ql=normAr(q.toLowerCase());
  const hay=[["code",code.toLowerCase()],["name",m.n.toLowerCase()],
    ["name",normAr((m.na||"").toLowerCase())],
    ...m.c.map(x=>["country",x.toLowerCase()]),
    ...(m.ca||[]).map(x=>["country",normAr(x.toLowerCase())])];
  let best=0,where=null;
  for(const[kind,h]of hay){
    let s=0;
    if(h===ql)s=100;
    else if(h.startsWith(ql))s=88;
    else if(h.split(/\s+/).some(w=>w.startsWith(ql)))s=78;
    else if(h.includes(ql))s=66;
    else if(ql.length>=3&&h.split(/\s+/).some(w=>lev1(ql,w)))s=44;
    if(kind==="code"&&s>0)s+=8;
    if(s>best){best=s;where=[kind,h]}
  }
  return{score:best,where};
}
const esc=s=>s.replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function hl(text,q){ // highlight the matched substring
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0||!q)return esc(text);
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}
function searchCurrencies(q,limit=12){
  if(!q)return[];
  return ALL_CODES.map(c=>({c,...fuzzyScore(q,c)}))
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score||a.c.localeCompare(b.c))
    .slice(0,limit);
}

/* ── animated number updates ── */
function animNum(el,to,fmtFn){
  const isInput=el.tagName==="INPUT";
  const put=s=>{isInput?el.value=s:el.innerHTML=s};
  const from=parseFloat((el.dataset.v||"").replace(/,/g,""));
  el.dataset.v=to;
  if(!isFinite(from)||from===to||Math.abs(from-to)/Math.abs(to||1)>0.5){put(fmtFn(to));return}
  const t0=performance.now();
  const step=now=>{let t=Math.min((now-t0)/320,1);t=1-Math.pow(1-t,3);
    put(fmtFn(from+(to-from)*t));
    if(t<1)requestAnimationFrame(step);
    else{el.classList.remove("num-updated");void el.offsetWidth;el.classList.add("num-updated")}};
  requestAnimationFrame(step);
}

const fmtRate=(v,a,b)=>{

/* ═════════ Data layer — Frankfurter (ECB) with snapshot fallback ═════════ */
const Data={
  live:false, latestDate:SNAPSHOT.latest_date, latestEUR:{...SNAPSHOT.latest,EUR:1},
  extUSD:{...EXT.rates}, extStamp:EXT.time_last_update_utc, extLive:false,
  cdnLatest:null, cdnPrev:null, cdnDayCache:new Map(), cdnMin:"2024-03-02",
  week:null, weekDates:[], seriesCache:new Map(), source:"Offline snapshot",
  CORE:["EUR","USD","GBP","JPY"],
  /* one fetch per DATE returns every currency vs USD → cached table
     is shared by charts, compare series, sparklines and market deltas */
  async cdnTable(dateIso){
    if(this.cdnDayCache.has(dateIso))return this.cdnDayCache.get(dateIso);
    const r=await fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${dateIso}/v1/currencies/usd.min.json`,{signal:AbortSignal.timeout(9000)});
    if(!r.ok)throw new Error("no data "+dateIso);
    const j=await r.json();
    const t={};for(const k in j.usd)t[k.toUpperCase()]=j.usd[k];
    const rec={date:j.date,table:t};
    this.cdnDayCache.set(dateIso,rec);return rec;
  },
  async init(){
    try{
      const r=await fetch("https://api.frankfurter.dev/v1/latest?base=EUR",{signal:AbortSignal.timeout(6000)});
      const j=await r.json();
      this.latestEUR={...j.rates,EUR:1};this.latestDate=j.date;this.live=true;
      this.source="ECB reference rates · live via Frankfurter";
    }catch(e){ this.source=`ECB reference rates · offline snapshot (fetched ${SNAPSHOT.fetched})`; }
    try{ /* extended coverage: 160+ currencies, daily, real timestamps */
      const r=await fetch("https://open.er-api.com/v6/latest/USD",{signal:AbortSignal.timeout(7000)});
      const j=await r.json();
      if(j.result==="success"){this.extUSD=j.rates;this.extStamp=j.time_last_update_utc;this.extLive=true}
    }catch(e){}
    try{ // last ~9 calendar days for day-Δ, 5-day Δ and sparklines, all symbols
      const end=this.latestDate,start=isoAdd(end,-9);
      const r=await fetch(`https://api.frankfurter.dev/v1/${start}..${end}?base=EUR`,{signal:AbortSignal.timeout(6000)});
      const j=await r.json();
      this.weekDates=Object.keys(j.rates).sort();
      this.week=this.weekDates.map(d=>({...j.rates[d],EUR:1}));
    }catch(e){ // offline: derive core-pair week from snapshot tail
      const H=SNAPSHOT.history,n=H.dates.length,tail=[...Array(6)].map((_,i)=>n-6+i);
      this.weekDates=tail.map(i=>H.dates[i]);
      this.week=tail.map(i=>({EUR:1,USD:H.USD[i],GBP:H.GBP[i],JPY:H.JPY[i]}));
    }
    /* broad provider: registry names + latest table + last 7 days
       (gives every currency a real rate, day Δ and sparkline) */
    try{
      const nm=await fetch("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies.json",{signal:AbortSignal.timeout(8000)});
      const names=await nm.json();
      for(const k in names)if(names[k])Registry.apiNames[k.toUpperCase()]=names[k];
      const latest=await this.cdnTable("latest");
      this.cdnLatest=latest;
      const d0=new Date(latest.date+"T00:00:00Z");
      const days=await Promise.all([...Array(7)].map((_,i)=>{
        const d=new Date(d0);d.setUTCDate(d.getUTCDate()-(6-i));
        return this.cdnTable(d.toISOString().slice(0,10)).catch(()=>null)}));
      this.cdnWeek=days.filter(Boolean);
      if(this.cdnWeek.length>=2)this.cdnPrev=this.cdnWeek[this.cdnWeek.length-2];
      Registry.update();
    }catch(e){}
  },
  /* ECB set → ECB rate; anything else → extended provider USD-cross. Source is always labelable. */
  usesECB(a,b){return isECB(a)&&isECB(b)},
  rate(a,b){
    if(this.usesECB(a,b)){const L=this.latestEUR;return(L[b]&&L[a])?L[b]/L[a]:null}
    const X=this.extUSD;if(X[b]&&X[a])return X[b]/X[a];
    const T=this.cdnLatest?.table;return(T&&T[b]&&T[a])?T[b]/T[a]:null;
  },
  sourceFor(a,b){
    return this.usesECB(a,b)
      ?{name:"ECB reference rate",stamp:dstr(this.latestDate),live:this.live,hist:true}
      :{name:"Exchange Rate API (open)",stamp:this.extStamp.replace(/:\d\d \+0000/," UTC"),live:this.extLive,hist:false};
  },
  /* delta vs previous reference day, % */
  dayDelta(a,b){
    if(this.week&&this.week.length>=2&&this.usesECB(a,b)){
      const w=this.week,i1=w.length-1,i0=w.length-2;
      const r1=w[i1][b]/w[i1][a],r0=w[i0][b]/w[i0][a];
      if(r1&&r0)return(r1/r0-1)*100;
    }
    const T1=this.cdnLatest?.table,T0=this.cdnPrev?.table;
    if(T1&&T0&&T1[a]&&T1[b]&&T0[a]&&T0[b])
      return((T1[b]/T1[a])/(T0[b]/T0[a])-1)*100;
    return null;
  },
  nDayDelta(a,b,n){
    if(this.week&&this.week.length>=2&&this.usesECB(a,b)){
      const w=this.week,i1=w.length-1,i0=Math.max(0,w.length-1-n);
      const r1=w[i1][b]/w[i1][a],r0=w[i0][b]/w[i0][a];
      if(r1&&r0)return(r1/r0-1)*100;
    }
    if(this.cdnWeek&&this.cdnWeek.length>=2){
      const t1=this.cdnWeek[this.cdnWeek.length-1].table,t0=this.cdnWeek[0].table;
      if(t1[a]&&t1[b]&&t0[a]&&t0[b])return((t1[b]/t1[a])/(t0[b]/t0[a])-1)*100;
    }
    return null;
  },
  weekSeries(a,b){
    if(this.week&&this.usesECB(a,b)){
      const v=this.week.map(w=>(w[b]&&w[a])?w[b]/w[a]:null);
      if(!v.some(x=>x==null))return v;
    }
    if(this.cdnWeek&&this.cdnWeek.length>=3){
      const v=this.cdnWeek.map(({table:t})=>(t[b]&&t[a])?t[b]/t[a]:null);
      if(!v.some(x=>x==null))return v;
    }
    return null;
  },
  coreOffline(a,b){return this.CORE.includes(a)&&this.CORE.includes(b)},
  snapshotSeries(a,b,startIso){
    const H=SNAPSHOT.history,g=c=>c==="EUR"?null:H[c];
    const A=g(a),B=g(b),out={dates:[],values:[]};
    for(let i=0;i<H.dates.length;i++){
      if(H.dates[i]<startIso)continue;
      const ra=a==="EUR"?1:A[i],rb=b==="EUR"?1:B[i];
      out.dates.push(H.dates[i]);out.values.push(rb/ra);
    }
    return out;
  },
  /* history is served by the provider-abstracted HistoryService below */
  series(a,b,startIso){return HistoryService.series(a,b,startIso)},
};
/* ═════════════════════════════════════════════════════════
   HISTORY SERVICE — provider abstraction.
   Ordered providers; the first that covers a pair is used,
   with graceful fallback to the next on failure. Swap or add
   providers here without touching any UI code.
   ═════════════════════════════════════════════════════════ */
const HistoryService={
  cache:new Map(),
  providers:[
    { id:"ecb", label:"ECB daily reference rates (Frankfurter)", min:"1999-01-04",
      covers:(a,b)=>isECB(a)&&isECB(b),
      async fetch(a,b,startIso){
        try{
          const r=await fetch(`https://api.frankfurter.dev/v1/${startIso}..${Data.latestDate}?base=${a}&symbols=${b}`,{signal:AbortSignal.timeout(9000)});
          const j=await r.json();const ds=Object.keys(j.rates).sort();

            clampNote:startIso<this.min?`ECB data begins ${dstr(this.min)}`:null};
        }catch(e){
          if(Data.coreOffline(a,b)){
            const snap=Data.snapshotSeries(a,b,startIso);
            return{dates:snap.dates,values:snap.values,src:"snapshot",

          }

    { id:"cdn", label:"Currency-API daily snapshots (jsDelivr)", min:"2024-03-02",
      covers:()=>true, /* any registry currency — gaps surface honestly below */
      async fetch(a,b,startIso){
        const latest=Data.cdnLatest||await Data.cdnTable("latest");
        Data.cdnLatest=latest;
        const end=new Date(latest.date+"T00:00:00Z");
        const clamp=startIso<this.min;
        const start=new Date(Math.max(+new Date(startIso+"T00:00:00Z"),+new Date(this.min+"T00:00:00Z")));
        const span=Math.max(1,Math.round((end-start)/864e5));

        const wanted=[];
        for(let d=new Date(start);d<=end;d.setUTCDate(d.getUTCDate()+step))wanted.push(d.toISOString().slice(0,10));
        if(wanted[wanted.length-1]!==latest.date)wanted.push(latest.date);

        for(let i=0;i<wanted.length;i+=8){ /* polite concurrency */

        }
        const pts=recs.filter(r=>r&&r.table[a]&&r.table[b]).map(r=>({d:r.date,v:r.table[b]/r.table[a]}));
        if(pts.length<2)return{dates:[],values:[],src:"unavailable"};
        pts.sort((x,y)=>x.d<y.d?-1:1);
        const ded=pts.filter((p,i)=>i===0||p.d!==pts[i-1].d);
        return{dates:ded.map(p=>p.d),values:ded.map(p=>p.v),src:"live",
          sampled:step>1?step:null,

      } },
  ],
  async series(a,b,startIso){
    const key=`${a}/${b}/${startIso}`;
    if(this.cache.has(key))return this.cache.get(key);
    let last=null;
    for(const p of this.providers){
      if(!p.covers(a,b))continue;
      try{
        const res=await p.fetch(a,b,startIso);
        res.provider=p.label;
        if(res.dates.length>=2){this.cache.set(key,res);return res}
        last=res;
      }catch(e){
        last={dates:[],values:[],src:"error",provider:p.label,
          note:"Could not load history — check your connection and retry."};
      }
    }
    return last||{dates:[],values:[],src:"unavailable",
      note:`No provider offers history for ${a}/${b}. The latest rate shown is real — Meridian never draws a synthetic chart.`};
  },
};

const Chart={
  cv:null,ctx:null,W:0,H:0,dates:[],values:[],win:{a:0,b:1},hover:-1,

  set(dates,values,meta){

  brand:true, /* Marsad gold line; deltas keep green/red */

    plot.forEach((sv,si)=>{

      c.strokeStyle=colors[si];c.lineWidth=1.5;c.lineJoin="round";c.lineCap="round";c.stroke();
      if(si===0&&!cmpOn){ /* subtle area */

        c.lineTo(this.X(i0+sv.length-1),this.H-this.PADB);c.lineTo(this.X(i0),this.H-this.PADB);c.closePath();
        c.fillStyle=g;c.fill();}
    });
    /* event markers */
    this.evHits=[];
    if(!override&&!cmpOn&&this.meta.a){
      const rel=EVENTS.filter(e=>(e.cur.includes(this.meta.a)||e.cur.includes(this.meta.b))
        &&e.d>=this.dates[i0]&&e.d<=this.dates[i1]);
      rel.forEach(e=>{
        let bi=this.dates.findIndex(d=>d>=e.d);if(bi<i0||bi>i1||bi<0)return;
        const x=this.X(bi);

    if(this.hover>=i0&&this.hover<=i1&&!override){

        c.font="600 11px "+getComputedStyle(document.body).fontFamily;

        c.fillStyle=cssv("--ink");c.textAlign="left";c.textBaseline="middle";c.fillText(vTxt,this.W-this.PADR+8,y);

  updateLegend(){

  },
  zoomAt(px,factor){const span=(this.win.b-this.win.a)*factor,k=(px-this.PADL)/(this.W-this.PADL-this.PADR);

    addEventListener("mouseup",()=>ry=null);
  },

/* ═════════ Sparkline ═════════ */
function spark(vals,w=64,h=26){
  if(!vals)return"";
  const min=Math.min(...vals),max=Math.max(...vals),rg=max-min||1;
  const up=vals[vals.length-1]>=vals[0];
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-2-(v-min)/rg*(h-4)).toFixed(1)}`).join(" ");
  return`<svg width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--${up?"gain":"loss"}-line)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

/* "nice" gridline step: 1 / 2 / 2.5 / 5 x 10^n */
function niceStep(min,max,n){const raw=((max-min)/n)||1;
  const mag=Math.pow(10,Math.floor(Math.log10(raw))),nm=raw/mag;
  return(nm<1.5?1:nm<2.25?2:nm<3.5?2.5:nm<7?5:10)*mag}
/* Home hero chart: gold line + area, horizontal gridlines with price labels on
   the right, and date labels along the bottom. Scales proportionally (no
   preserveAspectRatio="none") so the text never distorts.                    */
function heroChart(s,h=196){
  if(!s||!s.values||s.values.length<2)return"";
  const v=s.values,W=640,padL=6,padR=56,padT=10,padB=24;
  let min=Math.min(...v),max=Math.max(...v);
  if(min===max){min-=Math.abs(min)*.01||.01;max+=Math.abs(max)*.01||.01}
  const pad=(max-min)*.12;min-=pad;max+=pad;
  const step=niceStep(min+pad*.6,max-pad*.6,3),ticks=[];
  for(let t=Math.ceil(min/step)*step;t<=max+1e-12;t+=step)ticks.push(t);
  const X=i=>padL+i/(v.length-1)*(W-padL-padR);
  const Y=x=>padT+(1-(x-min)/(max-min))*(h-padT-padB);
  const dec=step>=1?2:4;
  const pts=v.map((x,i)=>`${X(i).toFixed(1)},${Y(x).toFixed(1)}`).join(" ");
  const grid=ticks.map(t=>`<line x1="${padL}" x2="${W-padR}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"
      stroke="var(--hairline)" stroke-width="1"/>
    <text x="${W-padR+7}" y="${(Y(t)+3.5).toFixed(1)}" fill="var(--ink3)" font-size="11"
      font-family="inherit" style="font-variant-numeric:tabular-nums">${t.toFixed(dec)}</text>`).join("");
  const lab=i=>{const d=s.dates[i];if(!d)return"";
    return new Date(d+"T00:00:00Z").toLocaleDateString(isAr()?"ar":"en",
      {month:"short",day:"numeric",timeZone:"UTC"})};
  const xi=[0,Math.floor((v.length-1)/2),v.length-1];
  const xlab=xi.map((i,k)=>`<text x="${X(i).toFixed(1)}" y="${h-7}" fill="var(--ink3)" font-size="11"
      font-family="inherit" text-anchor="${k===0?"start":k===1?"middle":"end"}">${lab(i)}</text>`).join("");
  return`<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto;display:block;direction:ltr;overflow:visible">
    ${grid}
    <line x1="${padL}" x2="${W-padR}" y1="${h-padB}" y2="${h-padB}" stroke="var(--hairline)" stroke-width="1"/>
    <polygon points="${padL},${h-padB} ${pts} ${(W-padR).toFixed(1)},${h-padB}"
      fill="var(--gold)" opacity=".07"/>
    <polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2.5"
      stroke-linejoin="round" stroke-linecap="round"/>
    ${xlab}
  </svg>`}
const srcLine=(a,b)=>{const s=Data.sourceFor(a,b);
  const lbl=s.name.startsWith("ECB")?T("src_ecb"):s.name.startsWith("Exchange")?T("src_ext"):T("src_cdn");
  return`${lbl} · ${s.stamp}${s.live?"":" · "+T("offline")}`};

/* ═══════════ NEWS — diverse real sources, resilient multi-transport ═══════════
   Why this is more than a fetch(): browsers block cross-origin RSS (publishers
   send no CORS headers), and free public mirrors rate-limit when hit in
   parallel. So we (a) spread requests across several mirrors, (b) run only a
   few lanes at a time, (c) fall back to a JSON bridge that speaks RSS+Atom,
   (d) cache the last good result, and (e) record per-source status so the UI
   can show exactly which publishers answered.                                */
const News={
  FEEDS:[
    ["The Libya Observer","https://libyaobserver.ly/rss.xml","en"],
    ["Libya Herald","https://libyaherald.com/feed/","en"],
    ["BBC عربي - اقتصاد","https://feeds.bbci.co.uk/arabic/business/rss.xml","ar"],
    ["BBC Business","https://feeds.bbci.co.uk/news/business/rss.xml","en"],
    ["فرانس 24","https://www.france24.com/ar/rss","ar"],
    ["العربية أسواق","https://www.alarabiya.net/feed/rss2/ar/aswaq.xml","ar"],
    ["OilPrice","https://oilprice.com/rss/main","en"],
    ["Kitco (Gold)","https://www.kitco.com/rss/KitcoNews.xml","en"],
    ["Investing Commodities","https://www.investing.com/rss/news_11.rss","en"],
    ["CNBC Economy","https://www.cnbc.com/id/20910258/device/rss/rss.html","en"],
    ["MarketWatch","https://feeds.content.dowjones.io/public/rss/mw_topstories","en"],
    ["Yahoo Finance","https://finance.yahoo.com/news/rssindex","en"],
    ["IMF","https://www.imf.org/en/News/RSS?Language=ENG","en"],
  ],
  /* Mirrors are rotated per feed so no single one is hammered.
     PUT YOUR OWN CLOUDFLARE WORKER FIRST for production — see README. */
  PROXIES:["https://api.allorigins.win/raw?url=",
           "https://api.codetabs.com/v1/proxy?quest=",
           "https://corsproxy.io/?url="],
  JSON_BRIDGE:"https://api.rss2json.com/v1/api.json?rss_url=",
  LANES:3,
  CATS:{n_libya:["libya","ليبيا","tripoli","طرابلس","بنغازي","misrata","مصراتة"],
        n_oil:["oil","نفط","opec","أوبك","crude","energy","طاقة","غاز","gas","barrel","برميل"],
        n_metal:["gold","ذهب","silver","فضة","bullion","معادن","platinum","palladium"],
        n_bank:["bank","مصرف","central bank","المركزي","cbl","interest rate","فائدة"],
        n_cur:["currency","عملة","dinar","دينار","dollar","دولار","exchange rate","صرف","forex","euro","يورو"],
        n_pol:["politic","سياس","election","انتخاب","sanction","عقوب","parliament","برلمان","حكومة","minister","وزير","war","حرب"],
        n_econ:["econom","اقتصاد","inflation","تضخم","imf","gdp","الناتج","market","أسواق","stocks","أسهم"]},
  /* Libyan outlets lead the feed; everything else follows by date. */
  PRIORITY:["The Libya Observer","Libya Herald"],
  items:[],loading:false,lastUpd:null,loaded:false,status:{},fromCache:false,
  /* ── one feed, several transports, first success wins ── */
  async loadOne(src,url,lang,idx){
    const order=News.PROXIES.map((_,i)=>News.PROXIES[(i+idx)%News.PROXIES.length]);
    for(const p of order){
      try{
        const r=await fetch(p+encodeURIComponent(url),{signal:AbortSignal.timeout(12000)});
        if(r.ok){const t=await r.text();
          if(t.includes("<item")||t.includes("<entry")){
            const it=News.parse(t,src,lang);
            if(it.length){News.status[src]="ok";return it}}}
      }catch(e){}
    }
    /* JSON bridge understands RSS and Atom and sends CORS headers itself */
    try{
      const r=await fetch(News.JSON_BRIDGE+encodeURIComponent(url),{signal:AbortSignal.timeout(12000)});
      if(r.ok){const j=await r.json();
        if(j&&j.status==="ok"&&Array.isArray(j.items)&&j.items.length){
          News.status[src]="ok";
          return j.items.map(x=>News.fromJson(x,src,lang)).filter(Boolean)}}
    }catch(e){}
    /* direct — succeeds on native apps, rarely in a browser */
    try{
      const r=await fetch(url,{signal:AbortSignal.timeout(8000)});
      if(r.ok){const t=await r.text();const it=News.parse(t,src,lang);
        if(it.length){News.status[src]="ok";return it}}
    }catch(e){}
    News.status[src]="fail";return[];
  },
  fromJson(x,src,lang){
    if(!x||!x.link||!/^https?:/.test(x.link))return null;
    const d=x.pubDate?new Date(x.pubDate.replace(" ","T")+(x.pubDate.includes("Z")?"":"Z")):null;
    const desc=(x.description||"").replace(/<[^>]+>/g,"").trim();
    return{title:(x.title||"").trim(),link:x.link,src,lang,
      th:x.thumbnail||(x.enclosure&&x.enclosure.link)||null,
      date:d&&!isNaN(d)?d:null,
      cat:News.categorize((x.title||"")+" "+desc)};
  },
  categorize(text){const t=text.toLowerCase();
    for(const k in News.CATS)if(News.CATS[k].some(w=>t.includes(w)))return k;
    return null},
  parse(xml,src,lang){
    const tag=(s,t)=>{const m=s.match(new RegExp(`<${t}[^>]*>([\\s\\S]*?)</${t}>`));
      let v=(m?m[1]:"").replace(/<!\[CDATA\[|\]\]>/g,"").replace(/<[^>]+>/g,"");
      return v.replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'")
        .replace(/&lt;/g,"<").replace(/&gt;/g,">").trim()};
    const blocks=[...xml.matchAll(/<item[\s>][\s\S]*?<\/item>/g),
                  ...xml.matchAll(/<entry[\s>][\s\S]*?<\/entry>/g)];
    return blocks.map(m=>{
      const s=m[0],title=tag(s,"title");if(!title)return null;
      let link=tag(s,"link");
      if(!link){link=(s.match(/<link[^>]*href="([^"]+)"/)||[])[1]||""}
      if(!link){const g=tag(s,"guid");if(/^https?:/.test(g))link=g}
      if(!/^https?:/.test(link))return null;
      const th=(s.match(/<(?:media:content|media:thumbnail|enclosure)[^>]*url="([^"]+)"/)||[])[1];
      let date=null;const pd=tag(s,"pubDate")||tag(s,"dc:date")||tag(s,"updated")||tag(s,"published");
      if(pd){const d=new Date(pd);if(!isNaN(d))date=d}
      return{title,link,src,lang,th,date,
        cat:News.categorize(title+" "+tag(s,"description")+" "+tag(s,"summary"))};
    }).filter(Boolean)},
  async refresh(){
    News.loading=true;News.status={};News.fromCache=false;render("news");
    const queue=News.FEEDS.map((f,i)=>[f,i]),out=[];
    const lane=async()=>{while(queue.length){
      const [f,i]=queue.shift();
      out.push(...await News.loadOne(f[0],f[1],f[2],i));}};
    await Promise.all(Array.from({length:News.LANES},lane));
    /* newest first, de-duplicated by link */
    const seen=new Set(),clean=[];
    const tier=n=>News.PRIORITY.includes(n.src)?0:1;
    out.sort((a,b)=>tier(a)-tier(b)||(b.date||0)-(a.date||0));
    for(const n of out){if(seen.has(n.link))continue;seen.add(n.link);clean.push(n)}
    if(clean.length){News.items=clean.slice(0,120);News.lastUpd=new Date();News.cache()}
    News.loading=false;News.loaded=true;render("news");render("home");},
  cache(){try{localStorage.setItem("marsad_news",JSON.stringify({
      at:Date.now(),items:News.items.slice(0,60).map(n=>({...n,date:n.date?n.date.toISOString():null}))}))}catch(e){}},
  hydrate(){try{const j=JSON.parse(localStorage.getItem("marsad_news")||"null");
    if(j&&Array.isArray(j.items)&&j.items.length){
      News.items=j.items.map(n=>({...n,date:n.date?new Date(n.date):null}));
      News.lastUpd=new Date(j.at);News.fromCache=true;return true}}catch(e){}
    return false},
  okCount(){return Object.values(News.status).filter(v=>v==="ok").length},
  sourceSheet(){
    const rows=News.FEEDS.map(([src])=>{const st=News.status[src];
      return`<div class="row" style="cursor:default">
        <span style="color:${st==="ok"?"var(--gain)":st==="fail"?"var(--loss)":"var(--ink3)"}">
          ${st==="ok"?IC.check:st==="fail"?IC.x:IC.hist}</span>
        <span class="mid"><span class="t1">${esc(src)}</span></span></div>`}).join("");
    Sheet.open(T("sources"),rows+`<div class="cap" style="margin-top:10px">${T("sources_note")}</div>`)},
  bk(link){const i=State.bookmarks.indexOf(link);
    i>=0?State.bookmarks.splice(i,1):State.bookmarks.push(link);Store.save();render(State.tab)},
  card(n,featured=false){
    const on=State.bookmarks.includes(n.link);
    const meta=`${esc(n.src)}${n.date?" · "+n.date.toLocaleDateString(isAr()?"ar":"en",{month:"short",day:"numeric"}):""}${n.cat?" · "+T(n.cat):""}`;

          <div class="fb"><div class="ft">${esc(n.title)}</div>

      <div class="nrow"><div class="nb"><div class="meta">${meta}</div>
        <div class="nt">${esc(n.title)}</div></div>
        <span class="nbk ${on?"on":""}" onclick="event.preventDefault();event.stopPropagation();News.bk('${esc(n.link)}')">${on?IC.bkF:IC.bk}</span>
        ${n.th?`<img class="th" src="${esc(n.th)}" loading="lazy" onerror="this.remove()">`:""}
      </div></a>`},
  render(){
    const list=State.newsCat?News.items.filter(n=>n.cat===State.newsCat):News.items;

    <div class="chips">

      ${Object.keys(News.CATS).map(k=>`<button class="chip ${State.newsCat===k?"on":""}"
        onclick="State.newsCat='${k}';render('news')">${T(k)}</button>`).join("")}
    </div>
    <div class="cap" style="margin:9px 3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      ${News.lastUpd?`<span>${T("last_upd")}: ${News.lastUpd.toLocaleTimeString(isAr()?"ar":"en",{hour:"2-digit",minute:"2-digit"})}${News.fromCache?" · "+T("from_cache"):""}</span>`:""}
      ${News.loaded?`<button style="border:none;background:none;color:var(--gold-dark);font-weight:700;cursor:pointer;padding:0"
        onclick="News.sourceSheet()">${ok}/${total} ${T("sources")}</button>`:""}
      <button style="border:none;background:none;color:var(--gold-dark);font-weight:700;cursor:pointer;padding:0"
        onclick="News.refresh()">${IC.refresh} ${T("refresh")}</button>
    </div>
    ${News.loading&&!list.length?`<div class="ngrid"><div class="skel" style="grid-column:1/-1;height:240px"></div>${'<div class="skel" style="height:100px"></div>'.repeat(6)}</div>`
     :!list.length?`
      <div class="empt"><div class="ic">${IC.news}</div>
        <b style="font-size:15.5px">${T("n_empty_t")}</b>
        <p class="cap" style="margin:8px auto 16px;font-size:12.5px;max-width:380px">${T("n_empty_b")}</p>
        <div style="max-width:280px;margin:0 auto">
          <button class="btn p" onclick="News.refresh()">${IC.refresh} ${T("refresh")}</button>
          <div style="height:8px"></div>
          <button class="btn o" onclick="News.sourceSheet()">${T("sources")}</button></div></div>`
     :`<div class="ngrid">${list.map((n,i)=>News.card(n,i===featIdx)).join("")}</div>`}

      <div class="card" style="margin-top:8px;padding:6px 14px;max-width:420px">${rows.filter(r=>r.v&&r.v.length>1).map(r=>{
        const ch=(r.v[r.v.length-1]/r.v[0]-1)*100;
        return`<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12.5px" class="num">
          <b>${r.l}</b><span class="${ch>=0?"up":"dn"}">${pctS(ch)}</span></div>`}).join("")}</div>`:"";},
};
/* ═══════════ router / boot ═══════════ */
function render(which){
  if(which==="home"||!which)$("v-home").innerHTML=Home.render();
  if(which==="convert"||!which)$("v-convert").innerHTML=Convert.render();
  if(which==="news"||!which)$("v-news").innerHTML=News.render();
}
const App={
  go(tab){State.tab=tab;
    for(const[id]of TABS)$("v-"+id).classList.toggle("on",id===tab);
    renderChrome();render(tab);window.scrollTo({top:0});},
  async search(){const c=await Picker.open(T("search"));
    if(!c)return;
    // metals/crypto read naturally as ASSET → USD (1 oz gold = $3,315)
    if(isAsset(c))Detail.open(c,"USD");
    else if(c==="LYD")Detail.open("USD","LYD");
    else Detail.open(c,"LYD");},
  settings(){Sheet.open(T("settings"),`
    <div class="cap" style="font-weight:700">${T("lang")}</div>
    <div class="seg" style="margin:6px 0 14px">
      <button class="${isAr()?"on":""}" onclick="App.setLang('ar')">العربية</button>
      <button class="${!isAr()?"on":""}" onclick="App.setLang('en')">English</button></div>
    <div class="cap" style="font-weight:700">${T("theme")}</div>
    <div class="seg" style="margin:6px 0 14px">
      <button class="${State.theme==="light"?"on":""}" onclick="App.setTheme('light')">${T("th_l")}</button>
      <button class="${State.theme==="dark"?"on":""}" onclick="App.setTheme('dark')">${T("th_d")}</button></div>
    <div class="card" style="padding:14px">
      <b style="font-size:13.5px">${T("data_src")}</b>
      <p class="cap" style="margin-top:6px;font-size:12px;line-height:1.7">${T("data_body")}</p>
      <p class="cap" style="margin-top:8px">${T("verify")}:
        <a href="https://cbl.gov.ly" target="_blank" rel="noopener noreferrer"
          style="color:var(--gold-dark);font-weight:700">cbl.gov.ly ${IC.ext}</a></p>
      <p class="cap" style="margin-top:8px">${T("nfa")}</p>
      <p class="cap" style="margin-top:8px">${T("version")}: <b style="color:var(--gold-dark)">3.0 (Marsad Web)</b></p>
    </div>`)},
  setLang(l){State.lang=l;Store.save();App.applyLang();Sheet.close();},
  applyLang(){document.documentElement.lang=State.lang;
    document.documentElement.dir=isAr()?"rtl":"ltr";
    renderChrome();render();Detail.built=false;$("scr-detail").classList.remove("on");
    $("sp-name").textContent=T("app");$("sp-sub").textContent=T("sub");
    $("sp-tag").textContent=T("tag").toUpperCase();
    $("onb-t").textContent=T("onb_t");$("onb-s").textContent=T("onb_s");
    $("onb-l").textContent=T("onb_l");$("onb-go").textContent=T("cont");
    $("onb-lang").innerHTML=`
      <button class="${isAr()?"on":""}" onclick="State.lang='ar';App.applyLang()">العربية</button>
      <button class="${!isAr()?"on":""}" onclick="State.lang='en';App.applyLang()">English</button>`;},
  setTheme(t){State.theme=t;Store.save();
    document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"");
    if($("scr-detail").classList.contains("on"))Chart.draw();
    App.settings();render(State.tab);},
  finishOnb(){State.onboarded=true;Store.save();
    $("scr-onb").classList.remove("on");App.go("home");},
};
(async function boot(){
  Store.load();
  document.documentElement.setAttribute("data-theme",State.theme==="dark"?"dark":"");
  $("splash-logo").innerHTML=logoSVG(88);
  $("onb-logo").innerHTML=logoSVG(72);
  App.applyLang();
  App.go("home");
  setTimeout(()=>{
    $("scr-splash").classList.remove("on");
    if(!State.onboarded)$("scr-onb").classList.add("on");
  },1000);
  if(News.hydrate())render();      // show last good articles instantly
  await Data.init();
  render();Home.loadHero();WB.load();News.refresh();
})();

</script>
</body>
</html>
